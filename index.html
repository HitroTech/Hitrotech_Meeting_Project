<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HitroTech Meet — Video Conferencing</title>
<meta name="description" content="Seamless, branded video meetings powered by HitroTech. Stay one step ahead." />
<link rel="icon" type="image/png" href="assets/logo.png" />
<link rel="preload" href="assets/fonts/space-grotesk-latin-var.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="landing-page">
  <header>
    <div class="container header-inner">
      <div class="logo-text"><span class="hitro">Hitro</span><span class="tech">Tech</span></div>
      <div class="logo-suffix">Meet</div>
    </div>
  </header>

  <main class="page-main">
    <div class="container stage">
      <div class="hero">
        <div class="hero-text">
          <h1>Seamless Meetings,<br />Powered by <span>HitroTech</span></h1>
          <p>Stay one step ahead — start or join a secure video meeting in seconds, no downloads needed.</p>
        </div>

        <div class="hero-illustration" aria-hidden="true">
          <div class="float-wrap">
            <svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg">
              <rect x="20" y="20" width="200" height="140" rx="16" fill="var(--svg-panel)" stroke="var(--brand-red)" stroke-width="3"/>
              <circle cx="120" cy="90" r="28" fill="var(--brand-red)" opacity="0.15"/>
              <circle cx="120" cy="80" r="16" fill="var(--brand-red)"/>
              <rect x="88" y="104" width="64" height="30" rx="15" fill="var(--brand-red)"/>
              <rect x="150" y="70" width="120" height="90" rx="14" fill="var(--card)" stroke="var(--brand-orange)" stroke-width="3"/>
              <circle cx="210" cy="105" r="18" fill="var(--brand-orange)" opacity="0.18"/>
              <circle cx="210" cy="98" r="10" fill="var(--brand-orange)"/>
              <rect x="192" y="112" width="36" height="18" rx="9" fill="var(--brand-orange)"/>
              <circle cx="270" cy="40" r="6" fill="var(--brand-red)" class="dot dot-a"/>
              <circle cx="30" cy="200" r="5" fill="var(--brand-orange)" class="dot dot-b"/>
              <path d="M240 190 q20 -10 34 4" stroke="var(--brand-red)" stroke-width="3" fill="none" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="form-col">
        <div class="card-glow" aria-hidden="true"></div>
        <div id="landing">
          <div class="field">
            <label for="roomName">Meeting Room Name</label>
            <input id="roomName" placeholder="e.g. team-standup" autocomplete="off" maxlength="40" />
            <span class="error-msg" id="roomNameError"></span>
          </div>
          <div class="field">
            <label for="displayName">Your Name</label>
            <input id="displayName" placeholder="e.g. Rizwan" autocomplete="off" maxlength="30" />
            <span class="error-msg" id="displayNameError"></span>
          </div>
          <button id="joinBtn">
            <span id="joinBtnText">Join / Start Meeting</span>
          </button>
          <p class="hint">No account needed — share the room name with your team to meet.</p>
        </div>
      </div>
    </div>

    <div class="container badges-row">
      <div class="badges">
        <div class="badge">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="var(--brand-orange)" opacity="0.15"/><path d="M8 12.5l2.5 2.5L16 9" stroke="var(--brand-orange)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Free &amp; Instant
        </div>
        <div class="badge">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="var(--brand-red)" opacity="0.15"/><path d="M13 7l-5 6h3.5L11 17l5-6h-3.5L13 7z" fill="var(--brand-red)"/></svg>
          No Downloads
        </div>
        <div class="badge">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="var(--brand-orange)" opacity="0.15"/><path d="M12 7l4 1.6v3.2c0 3-1.7 4.8-4 5.6-2.3-.8-4-2.6-4-5.6V8.6L12 7z" stroke="var(--brand-orange)" stroke-width="1.8" stroke-linejoin="round"/></svg>
          Secure Rooms
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      &copy; 2026 HitroTech · <a href="https://www.hitrotech.com" target="_blank" rel="noopener">hitrotech.com</a>
    </div>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
